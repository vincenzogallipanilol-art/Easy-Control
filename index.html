<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Easy Control — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    body { background: #f5f7fb; }
    .auth-card { max-width: 400px; width: 100%; }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg,#206bc4,#4299e1);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-mark svg { color: #fff; }
    #login-error { display: none; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-surface-secondary">

<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
        <div class="brand-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
        <span class="h2 mb-0 fw-bold">Easy Control</span>
      </div>
      <p class="text-muted">Gestione distribuzione pratiche</p>
    </div>

    <div class="card auth-card mx-auto shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Accedi al tuo account</h3>

        <div id="login-error" class="alert alert-danger" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control"
              placeholder="tuaemail@esempio.it" autocomplete="email" required/>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">
              Password
            </label>
            <div class="input-group input-group-flat">
              <input type="password" id="password" name="password" class="form-control"
                placeholder="La tua password" autocomplete="current-password" required/>
              <span class="input-group-text">
                <button type="button" class="btn btn-ghost-secondary btn-sm p-0 border-0"
                  id="toggle-pw" title="Mostra/nascondi password" style="line-height:1">
                  <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </span>
            </div>
          </div>
          <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100" id="btn-login">
              <span id="btn-login-text">Accedi</span>
              <span id="btn-login-spinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center text-muted mt-3 small">
      © Easy Control · Accesso riservato agli utenti autorizzati
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
  // Redirect se già loggato
  Auth.redirectIfLoggedIn('app.html');

  // Toggle password
  document.getElementById('toggle-pw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  // Login form
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('login-error');
    const btnText  = document.getElementById('btn-login-text');
    const spinner  = document.getElementById('btn-login-spinner');

    errEl.style.display = 'none';
    btnText.textContent = 'Accesso…';
    spinner.style.display = '';
    document.getElementById('btn-login').disabled = true;

    try {
      await Auth.signIn(email, password);
      window.location.href = 'app.html';
    } catch(err) {
      errEl.textContent = err.message === 'Invalid login credentials'
        ? 'Email o password non corretti.'
        : err.message;
      errEl.style.display = '';
      btnText.textContent = 'Accedi';
      spinner.style.display = 'none';
      document.getElementById('btn-login').disabled = false;
    }
  });
</script>
</body>
</html>
